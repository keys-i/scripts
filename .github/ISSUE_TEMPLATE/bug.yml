name: Bug report
description: Report a script that is broken, unsafe, or behaving unexpectedly
title: "fix: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: The cleanup script removes files outside the selected directory.
    validations:
      required: true
  - type: input
    id: script
    attributes:
      label: Script
      description: Path to the affected script
      placeholder: sys/linux/example
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest safe example that shows the problem.
      placeholder: |
        1. Run ...
        2. Pass ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
      description: What should happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, shell or interpreter version, and relevant tools
      placeholder: macOS 15, zsh 5.9, Python 3.13
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or other evidence
      description: Remove secrets and personal information before pasting output.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private data, and identifying host information.
          required: true
