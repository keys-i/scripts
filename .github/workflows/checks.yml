name: Checks

on:
  merge_group:
  pull_request:
    branches: [main, gui]
  push:
    branches: [main, actions, gui, py]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            language: sh
          - name: macOS
            os: macos-latest
            language: zsh

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Linux script
        if: matrix.language == 'sh'
        run: |
          sh -n sys/linux/clean
          shellcheck --shell=dash --severity=warning --exclude=SC1007 sys/linux/clean
          sys/linux/clean --self-test

      - name: Check macOS script
        if: matrix.language == 'zsh'
        run: |
          zsh -n sys/macos/clean
          sys/macos/clean --self-test

  powershell:
    name: PowerShell / Windows
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Analyze script
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer `
            -Path sys/windows/clean.ps1 `
            -Severity Warning, Error `
            -ExcludeRule PSReviewUnusedParameter, PSUseShouldProcessForStateChangingFunctions, PSUseSingularNouns
          if ($findings) {
            $findings | Format-Table -AutoSize
            exit 1
          }

      - name: Test script
        shell: pwsh
        run: ./sys/windows/clean.ps1 -SelfTest

  python-style:
    name: Python / style
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.11"
          enable-cache: false

      - name: Find and check Python scripts
        shell: bash
        run: |
          mapfile -t python_files < <(
            git ls-files -- 'bin/_common.py'
            git grep -Il '^#!/usr/bin/env -S uv run --script' -- '*.py' 'bin/*' || true
          )
          if (( ${#python_files[@]} == 0 )); then
            echo "No Python scripts found"
            exit 0
          fi
          printf 'Checking %s\n' "${python_files[@]}"
          uvx ruff@0.16.0 format --check --target-version=py311 "${python_files[@]}"
          uvx ruff@0.16.0 check --output-format=github --target-version=py311 "${python_files[@]}"

  python:
    name: Python / runtime / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.11"
          enable-cache: false

      - name: Test dashboard
        if: hashFiles('dev/gui.py') != ''
        run: uv run dev/gui.py --self-test

      - name: Test command tools
        shell: bash
        run: |
          mapfile -t scripts < <(
            git grep -Il '^#!/usr/bin/env -S uv run --script' -- 'bin/*' || true
          )
          for script in "${scripts[@]}"; do
            uv run --script "$script" --self-test
          done
          (( ${#scripts[@]} )) || echo "No Python command tools found"

  metadata:
    name: Repository files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Markdown and YAML formatting
        run: npx --yes prettier@3.9.6 --check '**/*.md' '.github/**/*.{yml,yaml}'

      - name: Check workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
