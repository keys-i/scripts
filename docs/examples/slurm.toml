[cluster]
account = "a_yourgroup"
partition = "gpu_cuda"
qos = "gpu"
gres = "gpu:a100:1"
constraint = "cuda80gb"
cpus_per_task = 4
mem = "32G"
time = "08:00:00"

[environment]
modules = ["miniforge/26.1.0-0"]
conda_env = "/scratch/user/yourname/conda/envs/flowIDS"
scratch_base = "/scratch/user/{user}"
check_gpu = true

[[jobs]]
name = "flowids"
branch = "m0"
workdir = "../../flowIDS"
configs = ["configs/*.toml"]
prepare = ["python", "scripts/get_dataset.py"]
prepare_once = true
command = [
  "python",
  "-m",
  "src.main",
  "--config",
  "{config}",
  "--seed",
  "{seed}",
  "--learning-rate",
  "{learning_rate}",
]

[jobs.matrix]
seed = [1, 2, 3]
learning_rate = [0.001, 0.0001]
